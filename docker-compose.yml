# Optional compose stack — not required for local Electron or `bun dev:web`.
# The editor stores projects in IndexedDB. Only start this if you need a
# containerized web build for demos.

services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID:-}
        - FREESOUND_API_KEY=${FREESOUND_API_KEY:-}
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://localhost:3100
      - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID:-}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  default:
    name: mangocut-network
