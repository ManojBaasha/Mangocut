name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: "postgresql://mangocut:mangocut@localhost:5432/mangocut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts and wasm-pack
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-pack.exe
            target
          # wasm-pack version: keep in sync with script/ensure-wasm-toolchain.sh.
          key: ${{ runner.os }}-cargo-wasm-pack-0.15.1-${{ hashFiles('Cargo.lock') }}

      # Installs the pinned wasm-pack (CI is set, so the script provisions).
      - name: Install wasm-pack
        shell: bash
        run: bash script/ensure-wasm-toolchain.sh

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      # Root install covers the apps/* workspaces; it installs the
      # mangocut-wasm stub, which the wasm build below replaces.
      - name: Install dependencies
        run: bun install

      # Builds rust/wasm/pkg (+ pkg-node) and syncs pkg into node_modules.
      - name: Build WASM
        run: bun run build:wasm:all

      - name: Rust tests
        run: cargo test --workspace

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Integration tests
        run: bun run test:integration

      - name: Timeline parity tests
        run: bun run test:parity
